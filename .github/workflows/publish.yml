name: CI & Automatic NPM Continuous Deployment

on:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate AI Skills (Linter)
        run: |
          python tools/validate_skills.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM
        run: |
          npm publish --access public || echo "Version already published or NPM_TOKEN required in GitHub Secrets"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
